<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-R6Y2WCMPHF"></script>
    <script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Leads — Witch Weekly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="svgviewer-png-output.png" type="image/png" />
    <style>
        body { background: var(--cream2); }
        .lad-wrap { max-width: 920px; margin: 0 auto; padding: 14px 16px 48px; }

        .lad-gate {
            max-width: 460px; margin: 4rem auto; padding: 1.5rem;
            border: 1.5px solid var(--border); background: var(--cream); text-align: center;
            font-family: 'Source Code Pro', monospace; font-size: 13px; color: var(--navy);
        }
        .lad-gate button, .lad-btn {
            font-family: 'Source Code Pro', monospace; font-size: 10.5px;
            letter-spacing: .1em; text-transform: uppercase; padding: 9px 14px;
            border: 1.5px solid var(--navy); background: transparent; color: var(--navy); cursor: pointer;
        }
        .lad-gate button { margin-top: 14px; background: var(--navy); color: var(--cream); }
        .lad-btn:hover { background: var(--navy); color: var(--cream); }
        .lad-btn.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; color: var(--navy); }
        .lad-btn.primary:hover { background: #d4c884; }
        .lad-btn.ghost { border-color: var(--border); }

        .lad-top {
            display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
            gap: 10px; margin-bottom: 14px;
        }
        .lad-title {
            font-family: 'Cinzel', serif; font-size: 1.4rem; font-weight: 700; color: var(--navy); margin: 0;
        }
        .lad-sub {
            font-family: 'Source Code Pro', monospace; font-size: 11px; color: var(--muted); margin-top: 3px;
        }
        .lad-top-actions { display: flex; gap: 6px; flex-wrap: wrap; }

        .lad-glance {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px;
        }
        .lad-card {
            background: var(--cream); border: 1.5px solid var(--border); padding: 12px 12px 11px;
        }
        .lad-card.today { border-color: var(--accent); background: rgba(201,185,122,.16); }
        .lad-card.warn { border-color: #8a3b2a; }
        .lad-card-label {
            font-family: 'Source Code Pro', monospace; font-size: 9px; letter-spacing: .12em;
            text-transform: uppercase; color: var(--muted);
        }
        .lad-card-val {
            font-family: 'Cinzel', serif; font-size: 1.55rem; font-weight: 700; color: var(--navy); margin-top: 2px;
            line-height: 1.1;
        }
        .lad-card-sub {
            font-family: 'Source Code Pro', monospace; font-size: 10px; color: var(--muted); margin-top: 3px;
        }

        .lad-activity {
            display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 12px; padding: 8px 12px;
            background: var(--cream); border: 1px solid var(--border);
            font-family: 'Source Code Pro', monospace; font-size: 11px; color: var(--navy);
        }
        .lad-activity strong { font-weight: 600; }
        .lad-activity span { color: var(--muted); }

        .lad-filters {
            display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
            margin-bottom: 12px; padding: 10px 12px; background: var(--cream); border: 1px solid var(--border);
        }
        .lad-chips { display: flex; flex-wrap: wrap; gap: 5px; }
        .lad-chip {
            font-family: 'Source Code Pro', monospace; font-size: 10px; letter-spacing: .08em;
            text-transform: uppercase; padding: 6px 10px; cursor: pointer;
            border: 1.5px solid var(--border); background: transparent; color: var(--navy);
        }
        .lad-chip.active { background: var(--navy); color: var(--cream); border-color: var(--navy); }
        .lad-filter {
            display: flex; flex-direction: column; gap: 3px;
            font-family: 'Source Code Pro', monospace; font-size: 9px;
            letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
        }
        .lad-filter input, .lad-filter select {
            font-family: 'Source Code Pro', monospace; font-size: 12px; color: var(--navy);
            border: 1px solid var(--border); background: #fff; padding: 7px 8px; min-width: 0;
        }
        .lad-filter input[type="search"] { min-width: 160px; }
        .lad-filter input[type="date"] { min-width: 132px; }
        .lad-custom-dates { display: none; gap: 8px; flex-wrap: wrap; }
        .lad-custom-dates.show { display: flex; }

        .lad-count {
            font-family: 'Source Code Pro', monospace; font-size: 11px; color: var(--muted);
            margin: 0 0 8px; letter-spacing: .04em;
        }

        .lad-list { display: flex; flex-direction: column; gap: 10px; }
        .lad-lead {
            background: #fff; border: 1.5px solid var(--border); padding: 12px 14px 14px;
        }
        .lad-lead.unshared { border-left: 4px solid #8a3b2a; }
        .lad-lead.shared { border-left: 4px solid #2f5540; }
        .lad-lead-head {
            display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px;
        }
        .lad-lead-when {
            font-family: 'Source Code Pro', monospace; font-size: 12px; font-weight: 600; color: var(--navy);
        }
        .lad-lead-when small { display: block; font-weight: 400; color: var(--muted); font-size: 10px; margin-top: 1px; }
        .lad-badges { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
        .lad-badge {
            display: inline-block; padding: 2px 7px; font-size: 9px; letter-spacing: .08em;
            text-transform: uppercase; border: 1px solid var(--border); background: var(--cream2);
            font-family: 'Source Code Pro', monospace; white-space: nowrap;
        }
        .lad-badge.inquiry { background: rgba(47,85,64,.12); border-color: #2f5540; }
        .lad-badge.find { background: rgba(201,185,122,.28); border-color: var(--accent); }
        .lad-badge.ok { background: rgba(47,85,64,.14); border-color: #2f5540; color: #2f5540; }
        .lad-badge.wait { background: rgba(138,59,42,.1); border-color: #8a3b2a; color: #8a3b2a; }

        .lad-name {
            font-family: 'Cinzel', serif; font-size: 1.05rem; font-weight: 700; color: var(--navy);
            margin: 8px 0 4px;
        }
        .lad-meta {
            font-family: 'Source Code Pro', monospace; font-size: 12px; color: var(--navy); line-height: 1.55;
        }
        .lad-meta a { color: var(--navy); font-weight: 600; }
        .lad-need {
            margin-top: 8px; padding: 8px 10px; background: var(--cream2); border: 1px solid var(--cream3);
            font-family: 'Source Code Pro', monospace; font-size: 12px; color: var(--text); line-height: 1.5;
            white-space: pre-wrap; word-break: break-word;
        }
        .lad-asked {
            margin-top: 8px; font-family: 'Source Code Pro', monospace; font-size: 11.5px; color: var(--navy);
        }
        .lad-asked a { font-weight: 600; color: var(--navy); }

        .lad-share {
            margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--cream3);
        }
        .lad-share-row {
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 8px;
        }
        .lad-check {
            display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
            font-family: 'Source Code Pro', monospace; font-size: 11.5px; font-weight: 600; color: var(--navy);
        }
        .lad-check input { width: 16px; height: 16px; accent-color: var(--navy); }
        .lad-share-meta { font-family: 'Source Code Pro', monospace; font-size: 11px; color: var(--muted); }

        .lad-chips-casters { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; min-height: 0; }
        .lad-caster-chip {
            display: inline-flex; align-items: center; gap: 5px;
            font-family: 'Source Code Pro', monospace; font-size: 10.5px;
            padding: 4px 8px; background: var(--cream); border: 1px solid var(--border); color: var(--navy);
        }
        .lad-caster-chip button {
            border: none; background: none; cursor: pointer; color: var(--muted); font-size: 13px; line-height: 1; padding: 0;
        }
        .lad-caster-chip small { color: var(--muted); font-size: 9px; }

        .lad-picker { position: relative; }
        .lad-picker-panel {
            display: none; position: absolute; z-index: 20; left: 0; top: calc(100% + 4px);
            width: min(340px, 90vw); max-height: 280px; overflow: auto; background: #fff;
            border: 1.5px solid var(--navy);
            box-shadow: 0 8px 24px rgba(27,45,62,.14);
        }
        .lad-picker.open .lad-picker-panel { display: block; }
        .lad-picker-search {
            position: sticky; top: 0; width: 100%; box-sizing: border-box;
            border: none; border-bottom: 1px solid var(--border); padding: 8px 10px;
            font-family: 'Source Code Pro', monospace; font-size: 12px;
        }
        .lad-picker-opt {
            display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer;
            font-family: 'Source Code Pro', monospace; font-size: 12px; color: var(--navy);
        }
        .lad-picker-opt:hover { background: rgba(201,185,122,.18); }
        .lad-picker-opt input { accent-color: var(--navy); }
        .lad-picker-empty { padding: 12px; color: var(--muted); font-size: 12px; font-style: italic; }

        .lad-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

        .lad-empty {
            padding: 32px 16px; text-align: center; color: var(--muted);
            font-family: 'Source Code Pro', monospace; font-size: 13px;
            background: var(--cream); border: 1px dashed var(--border);
        }

        .lad-toast {
            position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: var(--navy); color: var(--cream); padding: 10px 16px;
            font-family: 'Source Code Pro', monospace; font-size: 12px; z-index: 400;
            opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
            max-width: calc(100% - 32px);
        }
        .lad-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 720px) {
            .lad-wrap { padding: 12px 10px 40px; }
            .lad-glance { grid-template-columns: 1fr 1fr; }
            .lad-title { font-size: 1.2rem; }
            .lad-filter input[type="search"] { min-width: 0; width: 100%; }
            .lad-filters { flex-direction: column; align-items: stretch; }
            .lad-picker-panel { position: fixed; left: 10px; right: 10px; top: auto; bottom: 10px; max-height: 55vh; }
            .lad-lead { padding: 12px; }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <a class="logo-wrap" href="index.html">
            <div class="monogram">
                <svg width="24" height="24" viewBox="0 0 26 26" fill="none">
                    <polygon points="13,2 15,10 23,8 17,14 23,20 15,18 13,26 11,18 3,20 9,14 3,8 11,10" stroke="#c9b97a" stroke-width="1" fill="none"/>
                    <circle cx="13" cy="13" r="3" fill="none" stroke="#c9b97a" stroke-width="1"/>
                </svg>
            </div>
            <div class="logo-text">
                <span class="logo-main">Witch Weekly</span>
                <span class="logo-sub">Leads</span>
            </div>
        </a>
        <nav class="site-nav">
            <a href="index.html">Directory</a>
            <a href="find-spellcaster.html">Find Spellcaster</a>
            <a href="leads-analytics.html" class="nav-active">Leads</a>
            <span id="navAuthArea" class="nav-auth-area"></span>
        </nav>
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>
    </header>
    <div class="mobile-nav" id="mobileNav">
        <a href="index.html" class="mobile-nav-item">Directory</a>
        <a href="find-spellcaster.html" class="mobile-nav-item">Find Spellcaster</a>
        <a href="leads-analytics.html" class="mobile-nav-item">Leads</a>
    </div>

    <div class="lad-wrap" id="ladApp">
        <div class="lad-gate" id="ladGate">
            <div style="font-family:'Cinzel',serif;font-size:1.2rem;font-weight:700;margin-bottom:8px;">Sign in required</div>
            Sign in with the authorized account to manage leads.
            <br>
            <button type="button" id="ladSignInBtn">Sign In</button>
        </div>

        <div id="ladDashboard" style="display:none;">
            <div class="lad-top">
                <div>
                    <h1 class="lad-title">Leads</h1>
                    <div class="lad-sub">Times shown in IST</div>
                </div>
                <div class="lad-top-actions">
                    <button type="button" class="lad-btn ghost" id="ladRefreshBtn">Refresh</button>
                    <button type="button" class="lad-btn ghost" id="ladExportCsv">Export</button>
                </div>
            </div>

            <div class="lad-glance" id="ladGlance"></div>
            <div class="lad-activity" id="ladActivity"></div>

            <div class="lad-filters">
                <div class="lad-chips" id="ladDateChips">
                    <button type="button" class="lad-chip active" data-range="today">Today</button>
                    <button type="button" class="lad-chip" data-range="yesterday">Yesterday</button>
                    <button type="button" class="lad-chip" data-range="week">This week</button>
                    <button type="button" class="lad-chip" data-range="all">All</button>
                    <button type="button" class="lad-chip" data-range="custom">Custom</button>
                </div>
                <div class="lad-custom-dates" id="ladCustomDates">
                    <label class="lad-filter">From
                        <input type="date" id="ladDateFrom">
                    </label>
                    <label class="lad-filter">To
                        <input type="date" id="ladDateTo">
                    </label>
                </div>
                <label class="lad-filter">Source
                    <select id="ladLeadSource">
                        <option value="">All sources</option>
                        <option value="inquiry">Profile inquiry</option>
                        <option value="find">Find a Spellcaster</option>
                    </select>
                </label>
                <label class="lad-filter">Status
                    <select id="ladShareStatus">
                        <option value="">All</option>
                        <option value="unshared">Not shared</option>
                        <option value="shared">Shared</option>
                    </select>
                </label>
                <label class="lad-filter">Shared with
                    <select id="ladCasterFilter">
                        <option value="">Any caster</option>
                    </select>
                </label>
                <label class="lad-filter">Search
                    <input type="search" id="ladSearch" placeholder="Name, email, phone…">
                </label>
            </div>

            <div class="lad-count" id="ladCount"></div>
            <div class="lad-list" id="ladList"></div>
        </div>
    </div>

    <div class="lad-toast" id="ladToast"></div>

    <footer class="site-footer" id="siteFooter" role="contentinfo"></footer>
    <script src="site-footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="leads-analytics.js"></script>
    <script>
        document.getElementById('mobileMenuBtn')?.addEventListener('click', function () {
            this.classList.toggle('active');
            document.getElementById('mobileNav')?.classList.toggle('active');
        });
    </script>
</body>
</html>
