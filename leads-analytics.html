<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-R6Y2WCMPHF"></script>
    <script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Leads &amp; Analytics — Witch Weekly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="svgviewer-png-output.png" type="image/png" />
    <style>
        body { background: var(--cream2); }
        .lad-wrap { max-width: 100%; padding: 14px 16px 40px; }
        .lad-header {
            display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
            gap: 12px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1.5px solid var(--border);
        }
        .lad-title {
            font-family: 'Cinzel', serif; font-size: 1.45rem; font-weight: 700; color: var(--navy); margin: 0;
        }
        .lad-sub {
            font-family: 'Source Code Pro', monospace; font-size: 11px; color: var(--muted);
            letter-spacing: .06em; margin-top: 4px;
        }
        .lad-gate {
            max-width: 480px; margin: 4rem auto; padding: 1.5rem; border: 1.5px solid var(--border);
            background: var(--cream); text-align: center;
            font-family: 'Source Code Pro', monospace; font-size: 13px; color: var(--navy);
        }
        .lad-gate button {
            margin-top: 14px; font-family: 'Source Code Pro', monospace; font-size: 11px;
            letter-spacing: .1em; text-transform: uppercase; padding: 10px 18px;
            border: 1.5px solid var(--navy); background: var(--navy); color: var(--cream); cursor: pointer;
        }

        .lad-cards {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px; margin-bottom: 14px;
        }
        .lad-card {
            background: var(--cream); border: 1px solid var(--border); padding: 10px 12px;
        }
        .lad-card-label {
            font-family: 'Source Code Pro', monospace; font-size: 9px; letter-spacing: .12em;
            text-transform: uppercase; color: var(--muted);
        }
        .lad-card-val {
            font-family: 'Cinzel', serif; font-size: 1.35rem; font-weight: 700; color: var(--navy); margin-top: 4px;
        }
        .lad-card-sub {
            font-family: 'Source Code Pro', monospace; font-size: 10px; color: var(--muted); margin-top: 2px;
        }
        .lad-card.accent { border-color: var(--accent); background: rgba(201,185,122,.12); }
        .lad-card.diff { border-color: #2f5540; }

        .lad-tabs {
            display: flex; flex-wrap: wrap; gap: 0; border: 1.5px solid var(--border);
            margin-bottom: 10px; background: var(--cream);
        }
        .lad-tab {
            flex: 1; min-width: 110px; padding: 10px 12px; border: none; border-right: 1px solid var(--border);
            background: transparent; cursor: pointer;
            font-family: 'Source Code Pro', monospace; font-size: 10px; letter-spacing: .1em;
            text-transform: uppercase; color: var(--muted);
        }
        .lad-tab:last-child { border-right: none; }
        .lad-tab.active { background: rgba(201,185,122,.2); color: var(--navy); font-weight: 600; }

        .lad-filters {
            display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end;
            margin-bottom: 10px; padding: 10px; background: var(--cream); border: 1px solid var(--border);
        }
        .lad-filter {
            display: flex; flex-direction: column; gap: 3px;
            font-family: 'Source Code Pro', monospace; font-size: 9px;
            letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
        }
        .lad-filter input, .lad-filter select {
            font-family: 'Source Code Pro', monospace; font-size: 11.5px; color: var(--navy);
            border: 1px solid var(--border); background: #fff; padding: 6px 8px; min-width: 130px;
        }
        .lad-filter input[type="search"] { min-width: 180px; }
        .lad-filter-actions { display: flex; gap: 6px; margin-left: auto; }
        .lad-btn {
            font-family: 'Source Code Pro', monospace; font-size: 10px; letter-spacing: .08em;
            text-transform: uppercase; padding: 7px 12px; cursor: pointer;
            border: 1.5px solid var(--border); background: transparent; color: var(--navy);
        }
        .lad-btn:hover { background: var(--navy); color: var(--cream); }
        .lad-btn.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }

        .lad-panel { display: none; }
        .lad-panel.active { display: block; }

        .lad-table-wrap {
            overflow: auto; border: 1.5px solid var(--border); background: #fff;
            max-height: calc(100vh - 280px); min-height: 280px;
        }
        table.lad-table {
            width: 100%; border-collapse: collapse;
            font-family: 'Source Code Pro', monospace; font-size: 11px; color: var(--navy);
        }
        .lad-table thead th {
            position: sticky; top: 0; z-index: 2;
            background: var(--navy); color: var(--cream);
            font-size: 9.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
            text-align: left; padding: 8px 8px; white-space: nowrap; border: 1px solid #2c3f52;
        }
        .lad-table td {
            padding: 6px 8px; border: 1px solid #c9b97a66; vertical-align: top;
            max-width: 220px; word-break: break-word;
        }
        .lad-table tbody tr:nth-child(even) { background: #faf6ea; }
        .lad-table tbody tr:hover { background: rgba(201,185,122,.18); }
        .lad-table a { color: var(--navy); font-weight: 600; }
        .lad-table a:hover { color: #7c6300; }
        .lad-muted { color: var(--muted); }
        .lad-badge {
            display: inline-block; padding: 1px 6px; font-size: 9px; letter-spacing: .06em;
            text-transform: uppercase; border: 1px solid var(--border); background: var(--cream2);
            white-space: nowrap;
        }
        .lad-badge.inquiry { background: rgba(47,85,64,.12); border-color: #2f5540; }
        .lad-badge.find { background: rgba(201,185,122,.25); border-color: var(--accent); }
        .lad-socials { display: flex; flex-wrap: wrap; gap: 4px; }
        .lad-socials a {
            font-size: 9.5px; letter-spacing: .04em; text-transform: uppercase;
            padding: 2px 5px; border: 1px solid var(--border); text-decoration: none; font-weight: 500;
        }
        .lad-count {
            font-family: 'Source Code Pro', monospace; font-size: 10.5px; color: var(--muted);
            margin: 6px 0 0; letter-spacing: .06em;
        }
        .lad-empty {
            padding: 28px; text-align: center; color: var(--muted);
            font-family: 'Source Code Pro', monospace; font-size: 12px; font-style: italic;
        }
        .lad-compare-note {
            font-family: 'Source Code Pro', monospace; font-size: 11px; color: var(--navy);
            padding: 8px 10px; margin-bottom: 8px; background: var(--cream);
            border: 1px solid var(--border); line-height: 1.5;
        }
        @media (max-width: 768px) {
            .lad-table-wrap { max-height: none; }
            .lad-filter-actions { margin-left: 0; width: 100%; }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <a class="logo-wrap" href="index.html">
            <div class="monogram">
                <svg width="24" height="24" viewBox="0 0 26 26" fill="none">
                    <polygon points="13,2 15,10 23,8 17,14 23,20 15,18 13,26 11,18 3,20 9,14 3,8 11,10" stroke="#c9b97a" stroke-width="1" fill="none"/>
                    <circle cx="13" cy="13" r="3" fill="none" stroke="#c9b97a" stroke-width="1"/>
                </svg>
            </div>
            <div class="logo-text">
                <span class="logo-main">Witch Weekly</span>
                <span class="logo-sub">Leads &amp; Analytics</span>
            </div>
        </a>
        <nav class="site-nav">
            <a href="index.html">Directory</a>
            <a href="find-spellcaster.html">Find Spellcaster</a>
            <a href="leads-analytics.html" class="nav-active">Leads</a>
            <span id="navAuthArea" class="nav-auth-area"></span>
        </nav>
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>
    </header>
    <div class="mobile-nav" id="mobileNav">
        <a href="index.html" class="mobile-nav-item">Directory</a>
        <a href="find-spellcaster.html" class="mobile-nav-item">Find Spellcaster</a>
        <a href="leads-analytics.html" class="mobile-nav-item">Leads</a>
    </div>

    <div class="lad-wrap" id="ladApp">
        <div class="lad-gate" id="ladGate">
            <div style="font-family:'Cinzel',serif;font-size:1.2rem;font-weight:700;margin-bottom:8px;">Sign in required</div>
            Sign in with the authorized account to view leads, inquiries, and click analytics.
            <br>
            <button type="button" id="ladSignInBtn">Sign In</button>
        </div>

        <div id="ladDashboard" style="display:none;">
            <div class="lad-header">
                <div>
                    <h1 class="lad-title">Leads &amp; Analytics</h1>
                    <div class="lad-sub">Clicks · Inquiries · Find a Spellcaster · Lead comparison</div>
                </div>
                <button type="button" class="lad-btn" id="ladRefreshBtn">Refresh</button>
            </div>

            <div class="lad-cards" id="ladCards"></div>

            <div class="lad-tabs" role="tablist">
                <button class="lad-tab active" data-tab="overview">Overview</button>
                <button class="lad-tab" data-tab="clicks">Clicks</button>
                <button class="lad-tab" data-tab="inquiries">Inquiries</button>
                <button class="lad-tab" data-tab="find">Find Match</button>
                <button class="lad-tab" data-tab="leads">All Leads</button>
            </div>

            <div class="lad-filters" id="ladFilters">
                <label class="lad-filter">From
                    <input type="date" id="ladDateFrom">
                </label>
                <label class="lad-filter">To
                    <input type="date" id="ladDateTo">
                </label>
                <label class="lad-filter">Event type
                    <select id="ladEventType">
                        <option value="">All events</option>
                        <option value="profile_card_click">Profile card click</option>
                        <option value="contact_click">Contact click</option>
                        <option value="inquiry_submit">Inquiry submit</option>
                        <option value="share_click">Share click</option>
                    </select>
                </label>
                <label class="lad-filter">Lead source
                    <select id="ladLeadSource">
                        <option value="">All sources</option>
                        <option value="inquiry">Inquiries only</option>
                        <option value="find">Find Match only</option>
                    </select>
                </label>
                <label class="lad-filter">Spellcaster
                    <select id="ladProfileFilter">
                        <option value="">All profiles</option>
                    </select>
                </label>
                <label class="lad-filter">Search
                    <input type="search" id="ladSearch" placeholder="Name, email, text…">
                </label>
                <div class="lad-filter-actions">
                    <button type="button" class="lad-btn" id="ladClearFilters">Clear</button>
                    <button type="button" class="lad-btn primary" id="ladExportCsv">Export CSV</button>
                </div>
            </div>

            <div class="lad-panel active" id="ladPanelOverview"></div>
            <div class="lad-panel" id="ladPanelClicks"></div>
            <div class="lad-panel" id="ladPanelInquiries"></div>
            <div class="lad-panel" id="ladPanelFind"></div>
            <div class="lad-panel" id="ladPanelLeads"></div>
        </div>
    </div>

    <footer class="site-footer" id="siteFooter" role="contentinfo"></footer>
    <script src="site-footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="leads-analytics.js"></script>
    <script>
        document.getElementById('mobileMenuBtn')?.addEventListener('click', function () {
            this.classList.toggle('active');
            document.getElementById('mobileNav')?.classList.toggle('active');
        });
    </script>
</body>
</html>
